version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: sme_retention_postgres
    environment:
      POSTGRES_USER: sme_admin
      POSTGRES_PASSWORD: sme_secure_password
      POSTGRES_DB: sme_retention_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/schema/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sme_admin -d sme_retention_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: sme_retention_backend
    environment:
      DATABASE_URL: postgresql://sme_admin:sme_secure_password@db:5432/sme_retention_db
      PYTHONPATH: /app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: sme_retention_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
